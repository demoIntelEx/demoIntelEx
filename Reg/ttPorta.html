</body></html>`;
}

function openEDDPreview(key){
  const t = transactions.find(x=>x.key===key);
  if(!t){ toast('Select a row first','error'); return; }
  if(t.portal!=='transaction'){ toast('EDD form is only available for Transaction rows','error'); return; }

  _eddFormHtml = buildEDDFormHtml(t);

  openPanel('ti-download','EDD Form Preview', true);
  clearHeadMeta();

  const body = document.getElementById('dp-body');
  body.innerHTML = `
    <div class="preview-toolbar">
      <div style="font-size:11.5px;color:var(--text3);"><i class="ti ti-info-circle"></i> Auto-filled from this transaction's records — review before printing.</div>
      <button class="btn btn-primary btn-sm" onclick="printEDDForm()"><i class="ti ti-printer"></i> Print / Save as PDF</button>
    </div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px;">
      <iframe id="edd-preview-frame" style="width:100%;height:62vh;min-height:420px;border:none;border-radius:var(--radius);background:#fff;"></iframe>
    </div>`;

  const frame = document.getElementById('edd-preview-frame');
  frame.srcdoc = _eddFormHtml;
}

function printEDDForm(){
  if(!_eddFormHtml){ toast('Nothing to print yet','error'); return; }
  const w = window.open('', '_blank', 'width=850,height=1000');
  if(!w){ toast('Pop-up blocked — allow pop-ups to print the EDD form','error'); return; }
  w.document.open();
  w.document.write(_eddFormHtml);
  w.document.close();
  w.onload = () => { w.focus(); w.print(); };
  // Fallback in case onload already fired before we attached it.
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 400);
}

/* ═══════════════════════════════════════════════════════
 *  UPLOAD FLOW — Step 1 (form) → Step 2 (confirm) → submit
 *  Always attached to an already-selected transaction row.
 * ═══════════════════════════════════════════════════════ */
let _uploadState = null; // { portal, entityId, docType, file }

function openUploadFlow(key){
  const t = transactions.find(x=>x.key===key);
  if(!t){ toast('Select a row first','error'); return; }
  // Person Name / Branch are locked to the page-header's user-filter /
  // branch-filter. If the header is on "All Users"/"All Branches" (no
  // specific selection made), fall back to what's already captured on
  // this entity/case itself rather than showing "All Users"/"All Branches".
  const personName = (userFilter && userFilter!=='all') ? userFilter : (t.txnMeta?.personName || '');
  const branch     = (branchFilter && branchFilter!=='all') ? branchFilter : (t.txnMeta?.branch || '');
  _uploadState = { portal:t.portal, entityId:t.entityId, docType:null, file:null, personName, branch };
  openPanel('ti-upload','Upload Document');
  renderUploadStep1();
}

function renderUploadStep1(){
  const s = _uploadState;
  const body = document.getElementById('dp-body');

  const types = docTypesFor(s.portal);
  const docTypePicker = `
    <div class="field" style="margin-bottom:14px;">
      <label>Document Type <span class="req">*</span></label>
      <div class="doc-type-choice">
        ${types.map(dt=>`<button type="button" class="dtc-btn ${s.docType===dt.key?'selected':''}" onclick="setUploadDocType('${dt.key}')"><i class="ti ${dt.icon}"></i>${dt.label}</button>`).join('')}
      </div>
    </div>`;

  body.innerHTML = `
    <div class="confirm-strip">
      <div>
        <div class="cn">${s.entityId}${resolveEntityName(s.entityId) ? ' - '+escapeHtml(resolveEntityName(s.entityId)) : ''}</div>
        <div class="cs">${s.portal==='onboarding'?'Onboarding':'Transaction'}</div>
      </div>
    </div>
    ${docTypePicker}
    <div class="field" style="margin-bottom:14px;">
      <label>File — Image or PDF <span class="req">*</span></label>
      <div class="file-upload-zone" id="upload-file-zone">
        <input type="file" id="upload-file-input" accept="image/*,.pdf" onchange="handleUploadFile(this)"/>
        <i class="ti ti-cloud-upload"></i>
        <p id="upload-file-label">Click or drag &amp; drop<br><span style="font-size:9.5px;opacity:.6;">JPG · PNG · WEBP · PDF · max 8 MB</span></p>
      </div>
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Person Name <span style="font-weight:400;color:var(--text3);">(who is capturing this document)</span></label>
      <div class="text-input" style="display:flex;align-items:center;opacity:.75;cursor:not-allowed;">${escapeHtml(s.personName==='all'?'All Users':s.personName)}</div>
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Branch</label>
      <div class="text-input" style="display:flex;align-items:center;opacity:.75;cursor:not-allowed;">${escapeHtml(s.branch==='all'?'All Branches':s.branch)}</div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost btn-sm" onclick="closePanel()"><i class="ti ti-x"></i> Cancel</button>
      <button class="btn btn-primary btn-sm" onclick="goToConfirmStep()"><i class="ti ti-arrow-right"></i> Review Upload</button>
    </div>`;

  initUploadDropZone();
}

function setUploadDocType(key){
  _uploadState.docType = key;
  renderUploadStep1();
  // restore chosen file label if a file was already picked
  if(_uploadState.file){
    const z=document.getElementById('upload-file-zone'), l=document.getElementById('upload-file-label');
    if(z&&l){ z.classList.add('has-file'); l.innerHTML=`<strong style="font-size:12px;">${_uploadState.file.name}</strong>`; }
  }
}
function initUploadDropZone(){
  const z=document.getElementById('upload-file-zone'); if(!z) return;
  z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('dragover');});
  z.addEventListener('dragleave',()=>z.classList.remove('dragover'));
  z.addEventListener('drop',e=>{
    e.preventDefault();z.classList.remove('dragover');
    const f=e.dataTransfer.files[0];
    if(f){ document.getElementById('upload-file-input').files=e.dataTransfer.files; handleUploadFile({files:[f]}); }
  });
}
function handleUploadFile(input){
  const f=input.files?.[0]; if(!f) return;
  _uploadState.file = f;
  const z=document.getElementById('upload-file-zone'), l=document.getElementById('upload-file-label');
  z.classList.add('has-file');
  l.innerHTML=`<strong style="font-size:12px;">${f.name}</strong><br><span style="font-size:10px;">${(f.size/1024).toFixed(1)} KB · ${f.type||'unknown type'}</span>`;
}

function goToConfirmStep(){
  const s=_uploadState;
  if(!s.docType){ toast('Select a document type','error'); return; }
  if(!s.file){ toast('Select a file first','error'); return; }
  // Person Name / Branch are locked to the page-header's user-filter /
  // branch-filter — nothing to validate here, they're never empty.
  const MAX=8*1024*1024;
  if(s.file.size>MAX){ toast(`File too large (${(s.file.size/1024/1024).toFixed(1)} MB) — max 8 MB`,'error'); return; }
  // Freeze the Transaction ID (unix seconds) at review time so the value
  // shown to the user is exactly what gets saved.
  s.txnId = genTxnId();
  // Exp Date is captured automatically (today's date) — no manual input, not shown in the UI.
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  s.expiryTs = toEpochSec(today.getTime());
  renderConfirmStep();
}

function renderConfirmStep(){
  const s=_uploadState;
  const dtInfo = docTypeInfo(s.portal,s.docType);
  const name = resolveEntityName(s.entityId);
  const body = document.getElementById('dp-body');
  body.innerHTML = `
    <div style="text-align:center;padding:6px 0 14px;">
      <i class="ti ${dtInfo.icon}" style="font-size:36px;color:var(--accent);"></i>
      <div style="font-size:13px;font-weight:700;margin-top:8px;">Confirm this upload?</div>
    </div>
    <div class="preview-meta">
      <div class="pmi"><span class="k">Portal</span><span class="v">${s.portal==='onboarding'?'Onboarding':'Transaction'}</span></div>
      <div class="pmi"><span class="k">Entity</span><span class="v">${s.entityId}${name?' - '+escapeHtml(name):''}</span></div>
      <div class="pmi"><span class="k">Doc Type</span><span class="v">${dtInfo.label}</span></div>
      <div class="pmi"><span class="k">File</span><span class="v" style="font-size:10.5px;">${s.file.name}</span></div>
      <div class="pmi"><span class="k">Txn ID (Unix)</span><span class="v" style="font-size:10px;">${s.txnId}</span></div>
      <div class="pmi"><span class="k">Upload Date</span><span class="v">${fmtEpochSec(+s.txnId)}</span></div>
      <div class="pmi"><span class="k">Person Name</span><span class="v" style="font-family:var(--font);">${escapeHtml(s.personName==='all'?'All Users':s.personName)}</span></div>
      <div class="pmi"><span class="k">Branch</span><span class="v" style="font-family:var(--font);">${escapeHtml(s.branch==='all'?'All Branches':s.branch)}</span></div>
    </div>
    <div id="upload-gs-status"></div>
    <div class="form-actions">
      <button class="btn btn-ghost btn-sm" onclick="renderUploadStep1()"><i class="ti ti-arrow-left"></i> Back</button>
      <button class="btn btn-primary btn-sm" id="btn-confirm-upload" onclick="submitUpload()"><i class="ti ti-check"></i> Confirm Upload</button>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
 *  SUBMIT — practical "save to cache on button click" example.
 *  Clicking "Confirm Upload" does three real, observable things,
 *  synchronously in this order:
 *    1. Reads the picked file into a base64 data URL.
 *    2. Builds one docLog row and appends it to LOCAL_CACHE_KEY
 *       in localStorage via addRowToLocalCache() — a genuine
 *       browser cache write, not a simulated network call.
 *    3. Reloads logRows from HARDCODED_DOC_LOG + the cache, so the
 *       table and the document viewer immediately reflect it.
 *  There is no server round-trip: this is the whole write path.
 * ═══════════════════════════════════════════════════════ */
async function submitUpload(){
  const s=_uploadState;
  const gs=document.getElementById('upload-gs-status');
  const confirmBtn=document.getElementById('btn-confirm-upload');
  confirmBtn.disabled=true;
  gs.style.display='flex';gs.className='gs-status loading';
  gs.innerHTML=`<i class="ti ti-loader spinner"></i> Reading file…`;

  let base64, txnId;
  try{
    base64 = await fileToBase64(s.file);
    txnId = s.txnId || genTxnId();     // unix seconds, e.g. 1788907920
  }catch(err){
    gs.className='gs-status error';
    gs.innerHTML=`<i class="ti ti-alert-circle"></i> File read failed: ${err.message}`;
    confirmBtn.disabled=false; return;
  }

  gs.innerHTML=`<i class="ti ti-loader spinner"></i> Saving to cache…`;

  // Row shape matches HARDCODED_DOC_LOG exactly:
  // [ Transaction ID, Portal, ID, Doc Type, Doc Link, Exp Date, Person Name, Branch ]
  const row = [
    String(txnId),
    s.portal==='onboarding' ? 'Onboarding' : 'Transaction',
    String(s.entityId),
    s.docType,
    base64,                       // the file itself, stored + previewed straight from cache
    String(s.expiryTs||''),
    s.personName,
    s.branch,
  ];

  const saved = addRowToLocalCache(row);
  if(!saved){
    gs.className='gs-status error';
    gs.innerHTML=`<i class="ti ti-alert-circle"></i> Could not write to cache (storage blocked or full)`;
    confirmBtn.disabled=false; return;
  }

  gs.className='gs-status success';
  gs.innerHTML=`<i class="ti ti-circle-check"></i> Saved to cache · TXN: ${txnId}`;
  toast('Document saved to cache');
  setTimeout(async()=>{
    await loadDocLog();
    buildTransactions();
    selectedKey = groupKey(s.portal,s.entityId);
    renderTable();
    closePanel();
  },900);
}

/* ═══════════════════════════════════════════════════════
 *  INIT
 * ═══════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', loadInitialData);
</script>
